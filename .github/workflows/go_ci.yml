name: NexusIoT Go Microservices CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go 1.22
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build Go Microservices
      run: |
        go build -v ./...

    - name: Run Go Unit & Benchmark Tests
      run: |
        go test -v ./...
