<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusIoT | Distributed Industrial IoT Edge & Telemetry Platform</title>

  <!-- Google Fonts: Orbitron, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-obsidian: #06090e;
      --card-bg: #0d131f;
      --card-border: #1e293b;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-heading: 'Orbitron', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    .font-heading { font-family: var(--font-heading); }
    .font-mono { font-family: var(--font-mono); }

    .container-fluid { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

    .cyber-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .cyber-card:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.12);
    }

    .app-header {
      background: #090e17;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
    }

    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span { color: var(--accent-gold); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      text-transform: uppercase;
    }

    .status-online { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

    .btn-cyber {
      background: var(--accent-gold);
      color: #06090e;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-cyber:hover { background: #fbbf24; transform: translateY(-1px); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger:hover { background: var(--accent-red); color: #fff; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .main-layout-grid { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 24px; margin-bottom: 24px; }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .main-layout-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .header-flex { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Standalone React + Dashboard Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_DEVICES = [
      { device_id: 'DEV-TURBINE-01', name: 'Gas Turbine Alpha-1', type: 'TURBINE', location: 'Facility Sector A-1', status: 'ONLINE', ip_address: '192.168.1.101', mac_address: '00:1A:2B:3C:4D:5E' },
      { device_id: 'DEV-GEN-02', name: 'High-Output Generator Bravo-2', type: 'GENERATOR', location: 'Power Substation B', status: 'ONLINE', ip_address: '192.168.1.102', mac_address: '00:1A:2B:3C:4D:5F' },
      { device_id: 'DEV-HVAC-03', name: 'Industrial Chiller HVAC-3', type: 'HVAC', location: 'Cooling Tower C', status: 'ONLINE', ip_address: '192.168.1.103', mac_address: '00:1A:2B:3C:4D:60' },
      { device_id: 'DEV-PUMP-04', name: 'Chemical Transfer Pump Delta-4', type: 'PUMP', location: 'Processing Plant D', status: 'WARNING', ip_address: '192.168.1.104', mac_address: '00:1A:2B:3C:4D:61' },
    ];

    function NexusApp() {
      const [selectedDeviceID, setSelectedDeviceID] = useState('DEV-TURBINE-01');
      const [devices, setDevices] = useState(DEFAULT_DEVICES);
      const [step, setStep] = useState(0);
      const [anomalies, setAnomalies] = useState({});
      const [alerts, setAlerts] = useState([]);

      // Generate simulation telemetry data dynamically
      const generateTelemetry = (devId, s) => {
        const base = devId === 'DEV-TURBINE-01' ? { temp: 78.5, vibe: 2.1, press: 45.0, gas: 12.0, rpm: 3600 } :
                     devId === 'DEV-GEN-02' ? { temp: 65.0, vibe: 1.4, press: 32.0, gas: 8.5, rpm: 1800 } :
                     devId === 'DEV-HVAC-03' ? { temp: 42.0, vibe: 0.8, press: 60.0, gas: 5.0, rpm: 1200 } :
                                               { temp: 55.0, vibe: 4.8, press: 85.0, gas: 45.0, rpm: 2400 };

        const sine = Math.sin(s * 0.15 + (devId.length));
        const noise = (Math.random() - 0.5) * 0.8;

        let temp = +(base.temp + sine * 3.0 + noise).toFixed(1);
        let vibe = +(base.vibe + Math.abs(sine) * 0.4 + noise * 0.1).toFixed(2);
        let press = +(base.press + sine * 2.0).toFixed(1);
        let gas = +(base.gas + Math.random() * 1.5).toFixed(1);
        let rpm = base.rpm + Math.floor(sine * 25) + Math.floor(Math.random() * 10);
        let isAnomaly = false;

        const activeAnomaly = anomalies[devId];
        if (activeAnomaly) {
          isAnomaly = true;
          if (activeAnomaly === 'THERMAL') temp += 45.0;
          if (activeAnomaly === 'VIBRATION') vibe += 8.5;
          if (activeAnomaly === 'GAS_LEAK') gas += 180.0;
        }

        return { device_id: devId, temperature: temp, vibration: vibe, pressure: press, gas_ppm: gas, voltage: 380, rpm: rpm, is_anomaly: isAnomaly, recorded_at: new Date().toISOString() };
      };

      // Telemetry step loop (1.5s updates)
      useEffect(() => {
        const timer = setInterval(() => {
          setStep(prev => prev + 1);
        }, 1500);
        return () => clearInterval(timer);
      }, []);

      const currentTelemetry = generateTelemetry(selectedDeviceID, step);
      const currentDevice = devices.find(d => d.device_id === selectedDeviceID) || devices[0];

      // Handle anomaly triggers
      const handleTriggerAnomaly = (devId, anomalyType, active) => {
        setAnomalies(prev => {
          const next = { ...prev };
          if (active) next[devId] = anomalyType;
          else delete next[devId];
          return next;
        });

        if (active) {
          const newAlert = {
            alert_id: 'ALT-' + Date.now(),
            device_id: devId,
            severity: 'CRITICAL',
            metric_type: anomalyType,
            message: `Simulated fault injected [${anomalyType}] on ${devId}`,
            triggered_at: new Date().toISOString()
          };
          setAlerts(prev => [newAlert, ...prev]);
        }

        setDevices(prev => prev.map(d => d.device_id === devId ? { ...d, status: active ? 'CRITICAL' : 'ONLINE' } : d));
      };

      return (
        <div>
          {/* Header */}
          <header className="app-header">
            <div className="container-fluid header-flex">
              <div className="brand-title">
                <i className="fas fa-bolt" style={{ color: 'var(--accent-gold)' }}></i>
                NEXUS<span>IoT</span>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 500, marginLeft: '8px' }}>
                  v2.4 Enterprise Edge Platform
                </span>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <div className="status-pill status-online">
                  <span className="pulse-dot"></span> Telemetry Stream Active (1.5s)
                </div>
                <div className="status-pill status-online">
                  <i className="fas fa-network-wired"></i> 4/4 Nodes Online
                </div>
                {alerts.length > 0 ? (
                  <div className="status-pill status-critical" style={{ animation: 'pulse 1s infinite' }}>
                    <i className="fas fa-exclamation-triangle"></i> {alerts.length} Critical Alert(s)
                  </div>
                ) : (
                  <div className="status-pill status-online">
                    <i className="fas fa-shield-alt"></i> System Nominal
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="container-fluid" style={{ paddingTop: '24px', paddingBottom: '40px' }}>
            {/* Top 4 SVG Circular Telemetry Gauges */}
            <div className="dashboard-grid">
              <GaugeCard title="Thermal Sensor" val={currentTelemetry.temperature} unit="°C" max={150} warn={85} crit={100} icon="fas fa-thermometer-half" />
              <GaugeCard title="Bearing Vibration" val={currentTelemetry.vibration} unit="mm/s" max={15} warn={5.0} crit={8.0} icon="fas fa-wave-square" />
              <GaugeCard title="Hydraulic Pressure" val={currentTelemetry.pressure} unit="PSI" max={120} warn={80} crit={100} icon="fas fa-compress-arrows-alt" />
              <GaugeCard title="Atmospheric Gas" val={currentTelemetry.gas_ppm} unit="PPM" max={300} warn={100} crit={150} icon="fas fa-smog" />
            </div>

            {/* Oscilloscope & Digital Twin */}
            <div className="main-layout-grid">
              <OscilloscopeCard telemetry={currentTelemetry} step={step} />
              <DigitalTwinCard deviceID={currentDevice.device_id} name={currentDevice.name} rpm={currentTelemetry.rpm} temp={currentTelemetry.temperature} vibe={currentTelemetry.vibration} status={currentDevice.status} />
            </div>

            {/* Device Registry & Alerts */}
            <div className="main-layout-grid">
              <DeviceRegistryTable devices={devices} selectedID={selectedDeviceID} onSelect={setSelectedDeviceID} onTrigger={handleTriggerAnomaly} />
              <AlertsLogCard alerts={alerts} />
            </div>
          </main>
        </div>
      );
    }

    // Gauge Card Component
    function GaugeCard({ title, val, unit, max, warn, crit, icon }) {
      const color = val >= crit ? 'var(--accent-red)' : val >= warn ? 'var(--accent-gold)' : 'var(--accent-green)';
      const radius = 42;
      const circ = 2 * Math.PI * radius;
      const pct = Math.min(val / max, 1);
      const offset = circ - pct * circ;

      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px', fontSize: '0.8rem', fontWeight: 700 }}>
            <span><i className={icon} style={{ color, marginRight: '8px' }}></i>{title}</span>
            <span style={{ fontFamily: 'var(--font-mono)', color, fontSize: '0.7rem' }}>MAX {max}{unit}</span>
          </div>

          <div style={{ position: 'relative', display: 'flex', justifyContent: 'center', alignItems: 'center', height: '110px' }}>
            <svg width="110" height="110" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r={radius} fill="none" stroke="#1e293b" strokeWidth="8" />
              <circle cx="50" cy="50" r={radius} fill="none" stroke={color} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform="rotate(-90 50 50)" style={{ transition: 'stroke-dashoffset 0.5s ease' }} />
            </svg>
            <div style={{ position: 'absolute', textAlign: 'center' }}>
              <div className="font-heading" style={{ fontSize: '1.4rem', fontWeight: 800, color: '#fff' }}>{val}</div>
              <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{unit}</div>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '10px', borderTop: '1px solid #1e293b', paddingTop: '8px' }}>
            <span>Status:</span>
            <span style={{ color, fontWeight: 700 }}>{val >= crit ? 'CRITICAL OVERHEAD' : val >= warn ? 'ELEVATED' : 'NOMINAL'}</span>
          </div>
        </div>
      );
    }

    // Oscilloscope Component
    function OscilloscopeCard({ telemetry, step }) {
      const canvasRef = useRef(null);
      const historyRef = useRef([]);

      useEffect(() => {
        historyRef.current.push(telemetry);
        if (historyRef.current.length > 40) historyRef.current.shift();

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;

        for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        const points = historyRef.current;
        if (points.length < 2) return;
        const stepX = w / (points.length - 1);

        // Temp Line (Gold)
        ctx.beginPath(); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
        points.forEach((p, i) => {
          const y = h - ((p.temperature - 20) / 100) * (h - 20) - 10;
          if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * stepX, y);
        });
        ctx.stroke();

        // Vibration Line (Cyan)
        ctx.beginPath(); ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2;
        points.forEach((p, i) => {
          const y = h - (p.vibration / 15) * (h - 20) - 10;
          if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * stepX, y);
        });
        ctx.stroke();
      }, [telemetry, step]);

      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
            <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff' }}>
              <i className="fas fa-chart-line" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
              Real-Time Oscilloscope Waveforms
            </h3>
            <div style={{ fontSize: '0.75rem', display: 'flex', gap: '12px' }}>
              <span style={{ color: '#f59e0b' }}>Temp (°C)</span>
              <span style={{ color: '#06b6d4' }}>Vibration (mm/s)</span>
            </div>
          </div>
          <div style={{ background: '#080d16', border: '1px solid #1e293b', borderRadius: '8px', padding: '6px' }}>
            <canvas ref={canvasRef} width="700" height="210" style={{ width: '100%', height: '210px', display: 'block' }} />
          </div>
        </div>
      );
    }

    // Digital Twin Component
    function DigitalTwinCard({ deviceID, name, rpm, temp, vibe, status }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let angle = 0;

        const render = () => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;

          ctx.clearRect(0, 0, w, h);

          // Heat Aura Gradient
          const heatRad = 85 + vibe * 2;
          const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, heatRad);
          if (temp > 100) { grad.addColorStop(0, 'rgba(239,68,68,0.5)'); grad.addColorStop(1, 'rgba(239,68,68,0)'); }
          else { grad.addColorStop(0, 'rgba(16,185,129,0.2)'); grad.addColorStop(1, 'rgba(16,185,129,0)'); }

          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, heatRad, 0, Math.PI * 2); ctx.fill();

          // Outer Stator Ring
          ctx.strokeStyle = status === 'CRITICAL' ? '#ef4444' : '#1e293b'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2); ctx.stroke();

          // Rotating Turbine Blades
          ctx.save(); ctx.translate(cx, cy); angle += (rpm / 3600) * 0.15; ctx.rotate(angle);
          ctx.fillStyle = '#06b6d4';
          for (let i = 0; i < 6; i++) {
            ctx.rotate((Math.PI * 2) / 6);
            ctx.beginPath(); ctx.ellipse(0, -30, 7, 24, 0, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();

          // Center Shaft
          ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [rpm, temp, vibe, status]);

      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '14px' }}>
            <i className="fas fa-cube" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
            Hardware Digital Twin
          </h3>
          <div style={{ background: '#06090e', border: '1px solid #1e293b', borderRadius: '8px', padding: '12px', textAlign: 'center' }}>
            <canvas ref={canvasRef} width="200" height="200" style={{ width: '200px', height: '200px' }} />
            <div style={{ fontWeight: 800, color: '#fff', fontSize: '0.9rem', marginTop: '6px' }}>{name}</div>
            <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Rotor: <strong style={{ color: 'var(--accent-cyan)' }}>{rpm} RPM</strong> | Temp: <strong style={{ color: temp > 100 ? 'var(--accent-red)' : 'var(--accent-gold)' }}>{temp}°C</strong></div>
          </div>
        </div>
      );
    }

    // Registry Component
    function DeviceRegistryTable({ devices, selectedID, onSelect, onTrigger }) {
      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '14px' }}>
            <i className="fas fa-server" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
            Cluster Hardware Device Registry & Simulator Controls
          </h3>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid #1e293b', color: 'var(--text-muted)', textAlign: 'left' }}>
                  <th style={{ padding: '10px' }}>Device</th>
                  <th style={{ padding: '10px' }}>Location</th>
                  <th style={{ padding: '10px' }}>Health</th>
                  <th style={{ padding: '10px', textAlign: 'right' }}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {devices.map(dev => (
                  <tr key={dev.device_id} onClick={() => onSelect(dev.device_id)} style={{ borderBottom: '1px solid #1e293b', cursor: 'pointer', background: dev.device_id === selectedID ? 'rgba(245,158,11,0.1)' : 'transparent' }}>
                    <td style={{ padding: '10px' }}><strong>{dev.name}</strong><br/><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{dev.device_id}</span></td>
                    <td style={{ padding: '10px', color: 'var(--text-muted)' }}>{dev.location}</td>
                    <td style={{ padding: '10px' }}><span className={`status-pill ${dev.status === 'CRITICAL' ? 'status-critical' : dev.status === 'WARNING' ? 'status-warning' : 'status-online'}`}>{dev.status}</span></td>
                    <td style={{ padding: '10px', textAlign: 'right' }}>
                      <div style={{ display: 'flex', gap: '4px', justifyContent: 'flex-end' }}>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'THERMAL', true); }} className="btn-danger">🔥 Overheat</button>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'VIBRATION', true); }} className="btn-danger">⚡ Bearing</button>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'CLEAR', false); }} style={{ background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', fontSize: '0.72rem' }}>Clear</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Alerts Log Component
    function AlertsLogCard({ alerts }) {
      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '14px' }}>
            <i className="fas fa-bell" style={{ color: 'var(--accent-red)', marginRight: '8px' }}></i>
            Active Alert Log
          </h3>
          <div style={{ maxHeight: '220px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px' }}>
            {alerts.length === 0 ? (
              <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.8rem', padding: '20px' }}>
                <i className="fas fa-shield-alt" style={{ color: 'var(--accent-green)', fontSize: '1.2rem', marginBottom: '6px', display: 'block' }}></i>
                No active anomalies. All hardware nodes operating normally.
              </div>
            ) : (
              alerts.map(a => (
                <div key={a.alert_id} style={{ background: '#06090e', border: '1px solid rgba(239,68,68,0.3)', padding: '8px', borderRadius: '6px', fontSize: '0.78rem' }}>
                  <strong style={{ color: 'var(--accent-red)' }}>[{a.severity}] {a.device_id}</strong>
                  <div style={{ color: '#fff', marginTop: '2px' }}>{a.message}</div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NexusApp />);
  </script>
</body>
</html>
