<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusIoT | Distributed Industrial IoT Edge & Telemetry Platform</title>

  <!-- Google Fonts: Orbitron, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Three.js 3D WebGL Engine CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-obsidian: #06090e;
      --card-bg: #0d131f;
      --card-border: #1e293b;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-heading: 'Orbitron', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    .font-heading { font-family: var(--font-heading); }
    .font-mono { font-family: var(--font-mono); }

    .container-fluid { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

    .cyber-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .cyber-card:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.12);
    }

    .app-header {
      background: #090e17;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
    }

    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span { color: var(--accent-gold); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      text-transform: uppercase;
    }

    .status-online { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

    .btn-cyber {
      background: var(--accent-gold);
      color: #06090e;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-cyber:hover { background: #fbbf24; transform: translateY(-1px); }

    .btn-export {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-export:hover { background: #334155; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger:hover { background: var(--accent-red); color: #fff; }

    .search-input {
      background: #06090e;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      width: 220px;
    }

    .search-input:focus { border-color: var(--accent-gold); }

    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .main-layout-grid { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 24px; margin-bottom: 24px; }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .main-layout-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .header-flex { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_DEVICES = [
      { device_id: 'DEV-TURBINE-01', name: 'Gas Turbine Alpha-1', type: 'TURBINE', location: 'Facility Sector A-1', status: 'ONLINE', ip_address: '192.168.1.101', mac_address: '00:1A:2B:3C:4D:5E' },
      { device_id: 'DEV-GEN-02', name: 'High-Output Generator Bravo-2', type: 'GENERATOR', location: 'Power Substation B', status: 'ONLINE', ip_address: '192.168.1.102', mac_address: '00:1A:2B:3C:4D:5F' },
      { device_id: 'DEV-HVAC-03', name: 'Industrial Chiller HVAC-3', type: 'HVAC', location: 'Cooling Tower C', status: 'ONLINE', ip_address: '192.168.1.103', mac_address: '00:1A:2B:3C:4D:60' },
      { device_id: 'DEV-PUMP-04', name: 'Chemical Transfer Pump Delta-4', type: 'PUMP', location: 'Processing Plant D', status: 'WARNING', ip_address: '192.168.1.104', mac_address: '00:1A:2B:3C:4D:61' },
    ];

    function NexusApp() {
      const [selectedDeviceID, setSelectedDeviceID] = useState('DEV-TURBINE-01');
      const [devices, setDevices] = useState(DEFAULT_DEVICES);
      const [searchQuery, setSearchQuery] = useState('');
      const [step, setStep] = useState(0);
      const [anomalies, setAnomalies] = useState({});
      const [alerts, setAlerts] = useState([]);
      const [audioEnabled, setAudioEnabled] = useState(false);
      const [customModalOpen, setCustomModalOpen] = useState(false);
      const [customVal, setCustomVal] = useState({ temp: 120, vibe: 9.5 });

      const generateTelemetry = (devId, s) => {
        const base = devId === 'DEV-TURBINE-01' ? { temp: 78.5, vibe: 2.1, press: 45.0, gas: 12.0, rpm: 3600 } :
                     devId === 'DEV-GEN-02' ? { temp: 65.0, vibe: 1.4, press: 32.0, gas: 8.5, rpm: 1800 } :
                     devId === 'DEV-HVAC-03' ? { temp: 42.0, vibe: 0.8, press: 60.0, gas: 5.0, rpm: 1200 } :
                                               { temp: 55.0, vibe: 4.8, press: 85.0, gas: 45.0, rpm: 2400 };

        const sine = Math.sin(s * 0.15 + (devId.length));
        const noise = (Math.random() - 0.5) * 0.8;

        let temp = +(base.temp + sine * 3.0 + noise).toFixed(1);
        let vibe = +(base.vibe + Math.abs(sine) * 0.4 + noise * 0.1).toFixed(2);
        let press = +(base.press + sine * 2.0).toFixed(1);
        let gas = +(base.gas + Math.random() * 1.5).toFixed(1);
        let rpm = base.rpm + Math.floor(sine * 25) + Math.floor(Math.random() * 10);
        let isAnomaly = false;

        const activeAnomaly = anomalies[devId];
        if (activeAnomaly) {
          isAnomaly = true;
          if (activeAnomaly === 'THERMAL') temp += 45.0;
          if (activeAnomaly === 'VIBRATION') vibe += 8.5;
          if (activeAnomaly === 'CUSTOM') { temp = customVal.temp; vibe = customVal.vibe; }
        }

        return { device_id: devId, temperature: temp, vibration: vibe, pressure: press, gas_ppm: gas, voltage: 380, rpm: rpm, is_anomaly: isAnomaly, recorded_at: new Date().toISOString() };
      };

      useEffect(() => {
        const timer = setInterval(() => { setStep(prev => prev + 1); }, 1500);
        return () => clearInterval(timer);
      }, []);

      const currentTelemetry = generateTelemetry(selectedDeviceID, step);
      const secondaryTelemetry = generateTelemetry('DEV-PUMP-04', step);
      const currentDevice = devices.find(d => d.device_id === selectedDeviceID) || devices[0];

      const handleTriggerAnomaly = (devId, anomalyType, active) => {
        setAnomalies(prev => {
          const next = { ...prev };
          if (active) next[devId] = anomalyType;
          else delete next[devId];
          return next;
        });

        if (active) {
          const newAlert = {
            alert_id: 'ALT-' + Date.now(),
            device_id: devId,
            severity: 'CRITICAL',
            metric_type: anomalyType,
            message: `Fault injected [${anomalyType}] on ${devId}`,
            triggered_at: new Date().toISOString()
          };
          setAlerts(prev => [newAlert, ...prev]);

          if (audioEnabled) {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(880, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
              gain.gain.setValueAtTime(0.3, ctx.currentTime);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(); osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
          }
        }

        setDevices(prev => prev.map(d => d.device_id === devId ? { ...d, status: active ? 'CRITICAL' : 'ONLINE' } : d));
      };

      const handleExportCSV = () => {
        const rows = [
          ['Device ID', 'Name', 'Location', 'Status', 'Temp (C)', 'Vibration (mm/s)', 'Pressure (PSI)', 'RPM', 'Recorded At'],
          ...devices.map(d => {
            const t = generateTelemetry(d.device_id, step);
            return [d.device_id, d.name, d.location, d.status, t.temperature, t.vibration, t.pressure, t.rpm, t.recorded_at];
          })
        ];
        const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `NexusIoT_Telemetry_Report_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredDevices = devices.filter(d => 
        d.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        d.device_id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        d.location.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div>
          <header className="app-header">
            <div className="container-fluid header-flex">
              <div className="brand-title">
                <i className="fas fa-bolt" style={{ color: 'var(--accent-gold)' }}></i>
                NEXUS<span>IoT</span>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 500, marginLeft: '8px' }}>
                  v3.5 Enterprise Control Center
                </span>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                <button onClick={() => setCustomModalOpen(true)} className="btn-cyber">
                  <i className="fas fa-sliders"></i> Custom Injection
                </button>

                <button onClick={() => setAudioEnabled(!audioEnabled)} className="btn-export" style={{ background: audioEnabled ? 'rgba(239,68,68,0.2)' : '#1e293b', borderColor: audioEnabled ? 'var(--accent-red)' : '#334155' }}>
                  <i className={`fas ${audioEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`} style={{ color: audioEnabled ? 'var(--accent-red)' : '#fff' }}></i>
                  {audioEnabled ? 'Audio ON' : 'Enable Audio Siren'}
                </button>

                <button onClick={handleExportCSV} className="btn-export">
                  <i className="fas fa-file-csv"></i> Export CSV
                </button>

                <div className="status-pill status-online">
                  <span className="pulse-dot"></span> Active Stream
                </div>
              </div>
            </div>
          </header>

          <main className="container-fluid" style={{ paddingTop: '24px', paddingBottom: '40px' }}>
            <div className="dashboard-grid">
              <GaugeCard title="Thermal Sensor" val={currentTelemetry.temperature} unit="°C" max={150} warn={85} crit={100} icon="fas fa-thermometer-half" />
              <GaugeCard title="Bearing Vibration" val={currentTelemetry.vibration} unit="mm/s" max={15} warn={5.0} crit={8.0} icon="fas fa-wave-square" />
              <GaugeCard title="Hydraulic Pressure" val={currentTelemetry.pressure} unit="PSI" max={120} warn={80} crit={100} icon="fas fa-compress-arrows-alt" />
              <GaugeCard title="Atmospheric Gas" val={currentTelemetry.gas_ppm} unit="PPM" max={300} warn={100} crit={150} icon="fas fa-smog" />
            </div>

            <div className="main-layout-grid">
              <MultiNodeOscilloscopeCard nodeA={currentTelemetry} nodeB={secondaryTelemetry} step={step} />
              <ThreeDigitalTwinCard deviceID={currentDevice.device_id} name={currentDevice.name} rpm={currentTelemetry.rpm} temp={currentTelemetry.temperature} vibe={currentTelemetry.vibration} status={currentDevice.status} />
            </div>

            <div className="main-layout-grid">
              <DeviceRegistryTable devices={filteredDevices} selectedID={selectedDeviceID} onSelect={setSelectedDeviceID} onTrigger={handleTriggerAnomaly} searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
              <AlertsLogCard alerts={alerts} />
            </div>
          </main>

          {/* Custom Anomaly Injector Modal */}
          {customModalOpen && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(5px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }}>
              <div style={{ background: '#0d131f', border: '1px solid var(--accent-gold)', borderRadius: '12px', padding: '28px', maxWidth: '440px', width: '90%' }}>
                <h3 className="font-heading" style={{ color: '#fff', fontSize: '1.1rem', marginBottom: '14px' }}>
                  <i className="fas fa-sliders" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
                  Custom Hardware Anomaly Injector
                </h3>
                <div style={{ marginBottom: '14px' }}>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Target Thermal Temp (°C):</label>
                  <input type="number" value={customVal.temp} onChange={e => setCustomVal({ ...customVal, temp: +e.target.value })} style={{ width: '100%', background: '#06090e', border: '1px solid #1e293b', color: '#fff', padding: '8px', borderRadius: '6px', marginTop: '4px' }} />
                </div>
                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Bearing Vibration (mm/s):</label>
                  <input type="number" value={customVal.vibe} onChange={e => setCustomVal({ ...customVal, vibe: +e.target.value })} style={{ width: '100%', background: '#06090e', border: '1px solid #1e293b', color: '#fff', padding: '8px', borderRadius: '6px', marginTop: '4px' }} />
                </div>
                <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
                  <button onClick={() => setCustomModalOpen(false)} className="btn-export">Cancel</button>
                  <button onClick={() => { handleTriggerAnomaly(selectedDeviceID, 'CUSTOM', true); setCustomModalOpen(false); }} className="btn-cyber">Inject Custom Fault</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function GaugeCard({ title, val, unit, max, warn, crit, icon }) {
      const color = val >= crit ? 'var(--accent-red)' : val >= warn ? 'var(--accent-gold)' : 'var(--accent-green)';
      const radius = 42; const circ = 2 * Math.PI * radius;
      const pct = Math.min(val / max, 1); const offset = circ - pct * circ;
      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px', fontSize: '0.8rem', fontWeight: 700 }}>
            <span><i className={icon} style={{ color, marginRight: '8px' }}></i>{title}</span>
            <span style={{ fontFamily: 'var(--font-mono)', color, fontSize: '0.7rem' }}>MAX {max}{unit}</span>
          </div>
          <div style={{ position: 'relative', display: 'flex', justifyContent: 'center', alignItems: 'center', height: '110px' }}>
            <svg width="110" height="110" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r={radius} fill="none" stroke="#1e293b" strokeWidth="8" />
              <circle cx="50" cy="50" r={radius} fill="none" stroke={color} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform="rotate(-90 50 50)" style={{ transition: 'stroke-dashoffset 0.5s ease' }} />
            </svg>
            <div style={{ position: 'absolute', textAlign: 'center' }}>
              <div className="font-heading" style={{ fontSize: '1.4rem', fontWeight: 800, color: '#fff' }}>{val}</div>
              <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{unit}</div>
            </div>
          </div>
        </div>
      );
    }

    function MultiNodeOscilloscopeCard({ nodeA, nodeB, step }) {
      const canvasRef = useRef(null);
      const historyARef = useRef([]);
      const historyBRef = useRef([]);

      useEffect(() => {
        historyARef.current.push(nodeA); if (historyARef.current.length > 40) historyARef.current.shift();
        historyBRef.current.push(nodeB); if (historyBRef.current.length > 40) historyBRef.current.shift();
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext('2d'); const w = canvas.width; const h = canvas.height;
        ctx.clearRect(0, 0, w, h); ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        const pointsA = historyARef.current; const pointsB = historyBRef.current;
        if (pointsA.length < 2) return; const stepX = w / (pointsA.length - 1);
        ctx.beginPath(); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
        pointsA.forEach((p, i) => { const y = h - ((p.temperature - 20) / 100) * (h - 20) - 10; if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * stepX, y); }); ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2;
        pointsB.forEach((p, i) => { const y = h - ((p.temperature - 20) / 100) * (h - 20) - 10; if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * stepX, y); }); ctx.stroke();
      }, [nodeA, nodeB, step]);

      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
            <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff' }}>
              <i className="fas fa-chart-line" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
              Multi-Node Waveform Comparison Oscilloscope
            </h3>
            <div style={{ fontSize: '0.75rem', display: 'flex', gap: '14px' }}>
              <span style={{ color: '#f59e0b' }}>● {nodeA.device_id} Temp</span>
              <span style={{ color: '#06b6d4' }}>● DEV-PUMP-04 Temp</span>
            </div>
          </div>
          <div style={{ background: '#080d16', border: '1px solid #1e293b', borderRadius: '8px', padding: '6px' }}>
            <canvas ref={canvasRef} width="700" height="210" style={{ width: '100%', height: '210px', display: 'block' }} />
          </div>
        </div>
      );
    }

    function ThreeDigitalTwinCard({ deviceID, name, rpm, temp, vibe, status }) {
      const containerRef = useRef(null);
      const rotorRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current; if (!container || !window.THREE) return;
        const w = container.clientWidth || 220; const h = 200;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(0, 3, 7); camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = ''; container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xf59e0b, 1.2); dirLight.position.set(5, 10, 5); scene.add(dirLight);

        const turbineGroup = new THREE.Group();
        const ringGeo = new THREE.TorusGeometry(2.2, 0.15, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: status === 'CRITICAL' ? 0xef4444 : 0x1e293b, metalness: 0.8, roughness: 0.2 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat); turbineGroup.add(ringMesh);

        const coreGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
        const coreMat = new THREE.MeshStandardMaterial({ color: temp > 100 ? 0xef4444 : 0xf59e0b, metalness: 0.9, roughness: 0.1 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat); coreMesh.rotation.x = Math.PI / 2; turbineGroup.add(coreMesh);

        const bladeGroup = new THREE.Group();
        for (let i = 0; i < 6; i++) {
          const bladeGeo = new THREE.BoxGeometry(0.25, 1.6, 0.06);
          const bladeMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.8, roughness: 0.2 });
          const bladeMesh = new THREE.Mesh(bladeGeo, bladeMat); bladeMesh.position.y = 1.1;
          const bladePivot = new THREE.Group(); bladePivot.rotation.z = (Math.PI * 2 / 6) * i; bladePivot.add(bladeMesh);
          bladeGroup.add(bladePivot);
        }
        turbineGroup.add(bladeGroup); rotorRef.current = bladeGroup; scene.add(turbineGroup);

        let animId;
        const animate = () => {
          if (rotorRef.current) rotorRef.current.rotation.z += (rpm / 3600) * 0.12;
          turbineGroup.rotation.y += 0.005; renderer.render(scene, camera); animId = requestAnimationFrame(animate);
        };
        animate();
        return () => { cancelAnimationFrame(animId); renderer.dispose(); };
      }, [rpm, temp, vibe, status]);

      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '14px' }}>
            <i className="fas fa-cube" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
            3D WebGL Three.js Digital Twin
          </h3>
          <div style={{ background: '#06090e', border: '1px solid #1e293b', borderRadius: '8px', padding: '10px', textAlign: 'center' }}>
            <div ref={containerRef} style={{ width: '100%', height: '200px' }} />
            <div style={{ fontWeight: 800, color: '#fff', fontSize: '0.9rem', marginTop: '4px' }}>{name}</div>
            <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Rotor: <strong style={{ color: 'var(--accent-cyan)' }}>{rpm} RPM</strong></div>
          </div>
        </div>
      );
    }

    function DeviceRegistryTable({ devices, selectedID, onSelect, onTrigger, searchQuery, setSearchQuery }) {
      return (
        <div className="cyber-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
            <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff' }}>
              <i className="fas fa-server" style={{ color: 'var(--accent-gold)', marginRight: '8px' }}></i>
              Hardware Device Registry
            </h3>
            <input type="text" placeholder="🔍 Search hardware node..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="search-input" />
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid #1e293b', color: 'var(--text-muted)', textAlign: 'left' }}>
                  <th style={{ padding: '10px' }}>Device</th>
                  <th style={{ padding: '10px' }}>Location</th>
                  <th style={{ padding: '10px' }}>Health</th>
                  <th style={{ padding: '10px', textAlign: 'right' }}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {devices.map(dev => (
                  <tr key={dev.device_id} onClick={() => onSelect(dev.device_id)} style={{ borderBottom: '1px solid #1e293b', cursor: 'pointer', background: dev.device_id === selectedID ? 'rgba(245,158,11,0.1)' : 'transparent' }}>
                    <td style={{ padding: '10px' }}><strong>{dev.name}</strong><br/><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{dev.device_id}</span></td>
                    <td style={{ padding: '10px', color: 'var(--text-muted)' }}>{dev.location}</td>
                    <td style={{ padding: '10px' }}><span className={`status-pill ${dev.status === 'CRITICAL' ? 'status-critical' : dev.status === 'WARNING' ? 'status-warning' : 'status-online'}`}>{dev.status}</span></td>
                    <td style={{ padding: '10px', textAlign: 'right' }}>
                      <div style={{ display: 'flex', gap: '4px', justifyContent: 'flex-end' }}>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'THERMAL', true); }} className="btn-danger">🔥 Overheat</button>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'VIBRATION', true); }} className="btn-danger">⚡ Bearing</button>
                        <button onClick={(e) => { e.stopPropagation(); onTrigger(dev.device_id, 'CLEAR', false); }} style={{ background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', fontSize: '0.72rem' }}>Clear</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AlertsLogCard({ alerts }) {
      return (
        <div className="cyber-card">
          <h3 className="font-heading" style={{ fontSize: '0.95rem', color: '#fff', marginBottom: '14px' }}>
            <i className="fas fa-bell" style={{ color: 'var(--accent-red)', marginRight: '8px' }}></i>
            Active Alert Log
          </h3>
          <div style={{ maxHeight: '220px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px' }}>
            {alerts.length === 0 ? (
              <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.8rem', padding: '20px' }}>
                <i className="fas fa-shield-alt" style={{ color: 'var(--accent-green)', fontSize: '1.2rem', marginBottom: '6px', display: 'block' }}></i>
                System Nominal. No active alerts.
              </div>
            ) : (
              alerts.map(a => (
                <div key={a.alert_id} style={{ background: '#06090e', border: '1px solid rgba(239,68,68,0.3)', padding: '8px', borderRadius: '6px', fontSize: '0.78rem' }}>
                  <strong style={{ color: 'var(--accent-red)' }}>[{a.severity}] {a.device_id}</strong>
                  <div style={{ color: '#fff', marginTop: '2px' }}>{a.message}</div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NexusApp />);
  </script>
</body>
</html>
